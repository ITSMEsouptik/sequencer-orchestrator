<div class="dashboard">
  <h1>Dashboard</h1>
  <mat-chip-set>
    <mat-chip highlighted color="primary">{{ activeOrders() }} Active Orders</mat-chip>
  </mat-chip-set>

  <table mat-table [dataSource]="orders()" class="mat-elevation-z8">

    <ng-container matColumnDef="orderId">
      <th mat-header-cell *matHeaderCellDef>Order ID</th>
      <td mat-cell *matCellDef="let order">{{ order.orderId }}</td>
    </ng-container>

    <ng-container matColumnDef="patientName">
      <th mat-header-cell *matHeaderCellDef>Patient Name</th>
      <td mat-cell *matCellDef="let order">{{ order.patientName }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let order"
        [style.background-color]="statusColor(order.status)"
      >{{ order.status }}</td>
    </ng-container>

    <ng-container matColumnDef="daysSinceCreation">
      <th mat-header-cell *matHeaderCellDef>Days Since Creation</th>
      <td mat-cell *matCellDef="let order">{{ daysSinceCreation(order.createdAt) }}</td>
    </ng-container>

    <ng-container matColumnDef="lastUpdated">
      <th mat-header-cell *matHeaderCellDef>Last Updated</th>
      <td mat-cell *matCellDef="let order">{{ timeSinceUpdate(order.updatedAt) }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"
    (click)="onRowClick(row)"
    style="cursor: pointer;"
    ></tr>
  </table>
</div>
