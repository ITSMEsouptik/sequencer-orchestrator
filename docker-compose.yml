services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sequencer-orchestrator
      POSTGRES_USER: sequencer_orchestrator_user
      POSTGRES_PASSWORD: sequencer_orchestrator_pass
    ports:
      - "5433:5432"
    volumes:
      - /Volumes/Crucial X6/docker/volumes/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sequencer_orchestrator_user -d sequencer-orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns
      - DEFAULT_REGION=us-east-1
    volumes:
      - /Volumes/Crucial X6/docker/volumes/localstack:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init

# volumes: block removed — no longer needed