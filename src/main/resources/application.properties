spring.application.name=Sequencer-Orchestrator

# DataSource — matches docker-compose postgres service
spring.datasource.url=jdbc:postgresql://localhost:5432/sequencer-orchestrator
spring.datasource.username=sequencer_orchestrator_user
spring.datasource.password=sequencer_orchestrator_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Server
server.port=8080

# Custom sequencer properties
sequencer.polling.interval-ms=5000
sequencer.outbox.processor-interval-ms=1000
sequencer.outbox.batch-size=50
sequencer.sqs.main-queue-url=http://localhost:4566/000000000000/sequencer-orchestrator-main
sequencer.sqs.dlq-url=http://localhost:4566/000000000000/sequencer-orchestrator-dlq
sequencer.sqs.visibility-timeout-seconds=90
sequencer.sns.topic-arn=arn:aws:sns:us-east-1:000000000000:sequencer-orchestrator-events
sequencer.kafka.bootstrap-servers=localhost:9092
sequencer.kafka.topic=sequencer-orchestrator-events
sequencer.kafka.consumer-group=sequencer-orchestrator
sequencer.idempotency.ttl-hours=24

# AWS LocalStack
cloud.aws.region.static=us-east-1
cloud.aws.credentials.access-key=test
cloud.aws.credentials.secret-key=test
cloud.aws.endpoint=http://localhost:4566
