# AWS profile — real account config from sequencer-platform routing contract.
# Activate with: --spring.profiles.active=aws
# Do NOT commit real credentials; use IAM role or environment variables.

# Orchestrator inbound queue (all events land here; no filter policy)
sequencer.sqs.main-queue-url=https://sqs.us-east-1.amazonaws.com/043189681044/sequencer-orchestrator-inbound
sequencer.sqs.dlq-url=https://sqs.us-east-1.amazonaws.com/043189681044/sequencer-orchestrator-dlq

# SNS hub topic in orchestrator account
sequencer.sns.topic-arn=arn:aws:sns:us-east-1:043189681044:sequencer-events

# Disable LocalStack endpoint overrides so Spring Cloud AWS uses real AWS
spring.cloud.aws.sqs.endpoint=
spring.cloud.aws.sns.endpoint=

# Real region; credentials come from the instance role or environment
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=
spring.cloud.aws.credentials.secret-key=
