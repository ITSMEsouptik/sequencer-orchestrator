$kind: http-request
name: Enroll Patient
method: POST
url: '{{baseUrl}}/api/patients'
order: 1000
description: Enrolls a new patient into the CAR-T therapy program
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "John Doe",
      "dateOfBirth": "1980-05-15",
      "diagnosisCode": "C91.1",
      "hcpID": "{{hcpId}}",
      "treatmentCenterID": "{{treatmentCenterId}}"
    }
